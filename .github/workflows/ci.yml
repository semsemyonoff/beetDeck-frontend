name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The only step that fetches a toolchain from github.com, over a link that
      # drops often enough to matter. A download that dies part-way is not just a
      # failed run: the half-written Node stays in the shared tool cache *marked
      # complete*, so every later job reuses a broken interpreter. Hence
      # retry-after-clearing rather than a plain retry — the second attempt must
      # not find the wreckage of the first.
      - uses: actions/setup-node@v6
        id: node
        continue-on-error: true
        with:
          node-version: '24'
          cache: npm
      - name: Clear the half-installed Node
        if: steps.node.outcome == 'failure'
        run: rm -rf "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/node/24."*
      - uses: actions/setup-node@v6
        if: steps.node.outcome == 'failure'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check

  test:
    # Sequential, not for the dependency — the suites are independent — but for
    # the tool cache. Both jobs ask for the same `node-version` and share one
    # `hostedtoolcache` volume on the self-hosted runner, so on a version neither
    # has cached they would install it twice at once, each deleting the version
    # folder the other is copying into. This way one job installs and the other
    # reads, and only one of them can be caught by a dropped download.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Normally a cache hit — `lint` ran first and installed it. The retry is
      # here anyway for the run where the cache was swept in between; see the
      # comment on the same step above.
      - uses: actions/setup-node@v6
        id: node
        continue-on-error: true
        with:
          node-version: '24'
          cache: npm
      - name: Clear the half-installed Node
        if: steps.node.outcome == 'failure'
        run: rm -rf "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/node/24."*
      - uses: actions/setup-node@v6
        if: steps.node.outcome == 'failure'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test (vitest)
        run: npm run test
      # Production build doubles as a sanity check that the SPA compiles.
      - name: Build (sanity)
        run: npm run build
